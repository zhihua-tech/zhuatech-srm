spring:
  datasource:
    url: jdbc:h2:mem:srm;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: test-zhuatech-srm-secret-must-be-at-least-thirty-two-bytes
    expiration: PT1H
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  file-storage:
    root: ${java.io.tmpdir}/zhuatech-srm-test-files
    max-size: 20971520
  bootstrap-admin:
    enabled: false
