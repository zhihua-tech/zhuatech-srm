spring:
  application:
    name: zhuatech-srm
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhuatech_srm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:zhuatech}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8090,http://127.0.0.1:8090}
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:系统管理员}
    organization-code: ${BOOTSTRAP_ORGANIZATION_CODE:DEFAULT}
  file-storage:
    root: ${FILE_STORAGE_ROOT:./data/files}
    max-size: ${FILE_STORAGE_MAX_SIZE:20971520}
  business-rules:
    cron: ${BUSINESS_RULE_CRON:0 15 1 * * *}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  observations:
    key-values:
      application: zhuatech-srm
